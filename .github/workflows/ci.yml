name: ci

# saas-identity-platform-contract-test
# 推送链:
# - branch push(master/main) → 跑 contract-test（4 后端 live 比对 + L3 typecheck）
# - tag push → 同一套验证（本仓是验证层，不部署；2026-09-13 起补 tags 触发器，
#   旧版漏了它 —— v0.3.1-20260913 推 tag 时 CI 根本没跑）
# 镜像名/路径用 ${{ github.event.repository.name }} 避免跨仓劫持。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 4 后端共一个 PG（V016 seed）。本地 CI 起一个 postgres:16,
    # 3 真后端跑容器化迁移 + seed；msw 内存 fixture 不连 DB。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 无 ?schema=public 后缀：那是 prisma 风格参数，Npgsql 不认（run 34724026070
      # aspnetcore 启动即崩 ArgumentException）。node-pg / drizzle 都不需要它。
      DATABASE_URL: postgresql://saas:saas@localhost:5432/saas
      # msw server.ts 读它挂 CORS（2026-09-13 起 env 驱动 + fail-fast，缺即 exit 1）；
      # CI checkout 无 .env，必须由 workflow 注入三前端 dev origin
      SAAS_CORS_ALLOWED_ORIGINS: http://localhost:5101,http://localhost:5102,http://localhost:5103
      TRACE_MAP: "1"
      CONTRACT_TARGETS: msw,aspnetcore,springboot,nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmmirror.com/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install contract-test deps
        run: npm ci --registry=https://registry.npmmirror.com

      # shared 仓作为 sibling 被 checkout（gen:shared 读 ../saas-identity-platform-shared/...）
      # multi-repo-family.md §2 强制 sibling 引用，不以包依赖 import
      - name: Checkout shared sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/saas-identity-platform-shared.git ../saas-identity-platform-shared

      # 4 后端作为 sibling 被 checkout
      - name: Checkout backend siblings
        run: |
          set -e
          for repo in msw aspnetcore springboot nextjs; do
            git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/saas-identity-platform-$repo.git ../saas-identity-platform-$repo
          done

      # 各仓依赖安装（前置，避免 healthcheck 阶段再 compile）
      - name: msw install
        working-directory: ../saas-identity-platform-msw
        run: npm ci --registry=https://registry.npmmirror.com

      - name: aspnetcore restore
        working-directory: ../saas-identity-platform-aspnetcore
        run: dotnet restore src/Saas.Identity.AspNetCore.csproj

      - name: springboot install (offline-able)
        working-directory: ../saas-identity-platform-springboot
        run: mvn -q -DskipTests dependency:go-offline

      - name: nextjs install
        working-directory: ../saas-identity-platform-nextjs
        run: npm ci --registry=https://registry.npmmirror.com

      # nextjs 跑前需要从 shared OpenAPI 重新生成端点类型
      - name: nextjs gen:shared
        working-directory: ../saas-identity-platform-nextjs
        run: npm run gen:shared

      # service PG 是空的：三真后端启动即查库。先 migrate（journal 建立）+ seed（种子基线）。
      # 走 nextjs sibling 的 runtime 迁移链（ADR-0025 收尾后迁移唯一真相 = shared/drizzle）。
      - name: migrate + seed service PG
        working-directory: ../saas-identity-platform-nextjs
        env:
          DATABASE_URL: postgresql://saas:saas@localhost:5432/saas
          DRIZZLE_MIGRATIONS_DIR: ../saas-identity-platform-shared/drizzle
        run: |
          # 空库前置：migration 0000 的 DDL 用 uuid_generate_v4()，postgres:16 镜像
          # 不带 uuid-ossp 扩展（run 34723778096 的挂点）。shared 的 migrate-db.mjs
          # 有 ensureExtensions 同款 preamble，但 CI 走 nextjs runtime config，这里补。
          node -e "const {Client} = require('pg'); const c = new Client({connectionString: process.env.DATABASE_URL}); c.connect().then(async () => { await c.query('CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\"'); console.log('[ci] extension uuid-ossp OK'); await c.end(); })"
          npx --no drizzle-kit migrate --config drizzle.runtime.config.ts
          node scripts/seed-db.mjs

      # 起 4 后端 + healthcheck + vitest（核心步骤）
      # - 后台 nohup ... & 启 4 进程，PID 入 PIDS 数组
      # - trap cleanup EXIT 确保 step exit 时清理所有子进程 + 兜底 pkill 孙子
      # - healthcheck 串行 90s，任一 return 1 → set -e → step fail → trap 触发
      # - npx --no vitest run 必须在所有 4 后端 healthcheck 通过后才跑
      # 注：路径 `src/Saas.Identity.AspNetCore.csproj` 与 nextjs `gen:shared` 命令名
      # 按实际仓当前 PR 微调——子仓改动时这里同步改，不要盲目照搬。
      - name: Run 4 backends + healthcheck + vitest
        working-directory: .
        run: |
          set -e
          mkdir -p .runtime-logs
          # 日志统一落本仓 .runtime-logs/（绝对路径）：后台进程先 cd 进 sibling 再启动，
          # 相对重定向会在 sibling 下找 .runtime-logs/ → 不存在 → 进程根本起不来
          # （2026-09-13 run 34723338655 msw healthcheck 挂的根因）。
          LOGDIR="$(pwd)/.runtime-logs"
          PIDS=()

          (cd ../saas-identity-platform-msw && nohup npm run dev > "$LOGDIR/msw.log" 2>&1) & PIDS+=($!)
          # aspnetcore：NpgsqlConnectionStringBuilder 只吃关键字形态，不吃 postgresql://
          # URI（run 34724342804 "Format of the initialization string ... index 0"）
          (cd ../saas-identity-platform-aspnetcore && DATABASE_URL="Host=localhost;Port=5432;Username=saas;Password=saas;Database=saas" nohup dotnet run --project src/Saas.Identity.AspNetCore.csproj > "$LOGDIR/aspnetcore.log" 2>&1) & PIDS+=($!)
          # springboot 的 datasource.url 是 jdbc 形态（application.yml 直灌 hikari，
          # PG 驱动要求 jdbc: 前缀），凭据走 DATABASE_USER/DATABASE_PASSWORD 独立 key
          # ——与 job 级 postgresql:// 形态（aspnetcore/nextjs 消费）不同源，故子壳覆盖
          (cd ../saas-identity-platform-springboot && DATABASE_URL="jdbc:postgresql://localhost:5432/saas" DATABASE_USER=saas DATABASE_PASSWORD=saas nohup mvn -q spring-boot:run > "$LOGDIR/springboot.log" 2>&1) & PIDS+=($!)
          (cd ../saas-identity-platform-nextjs && nohup npm run dev > "$LOGDIR/nextjs.log" 2>&1) & PIDS+=($!)

          cleanup() {
            echo "::group::cleanup: killing ${#PIDS[@]} children + grandchildren"
            for p in "${PIDS[@]}"; do kill -TERM "$p" 2>/dev/null || true; done
            pkill -f Saas.Identity.AspNetCore 2>/dev/null || true
            pkill -f spring-boot:run          2>/dev/null || true
            pkill -f next-server              2>/dev/null || true
            pkill -f tsx                      2>/dev/null || true
            echo "::endgroup::"
          }
          trap cleanup EXIT

          healthcheck() {
            local name=$1 url=$2
            for i in $(seq 1 90); do
              if curl -sf -o /dev/null --max-time 2 "$url"; then
                echo "ok $name up after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name healthcheck failed at $url within 90s"
            echo "::group::$name log tail-30"
            tail -n 30 "$LOGDIR/$name.log" || true
            echo "::endgroup::"
            return 1
          }

          healthcheck msw        http://localhost:5100/healthz
          healthcheck aspnetcore http://localhost:5104/health
          healthcheck springboot http://localhost:5105/actuator/health
          healthcheck nextjs     http://localhost:5101/api/health

          npx --no vitest run

      # 上传 .runtime-logs/ 供失败时排查（4 后端的 log 各 tail 100 已能定位）
      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: .runtime-logs/
          if-no-files-found: ignore

      # L3 typecheck（独立 step，避免 vitest 失败的 stderr 干扰）
      - name: L3 typecheck
        run: npx --no tsc --noEmit

      # L5 alignment + 全 gate：不在 CI 跑（2026-09-13 撤除）。原步骤 `working-directory: ..`
      # 跑 `python scripts/gate.py`，但 CI 从未 checkout suite（无 harness 可执行），
      # 08-31 建立起就是死步骤 —— 只是从没被跑到（container init 先炸）。suite 门
      # （L0/L0.5/L5）是本机 harness 职责，push 前本地 `python scripts/gate.py -p …` 把守。